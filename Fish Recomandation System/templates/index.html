<!DOCTYPE html>
<html>
  <head>
    <title>Fish Suitability Predictor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h2>Enter Water Parameters</h2>
    <form method="POST" action="/predict">
      <label>pH:</label>
      <input type="number" step="0.01" name="ph" required />

      <label>Temperature (°C):</label>
      <input type="number" step="0.01" name="temperature" required />

      <label>Turbidity (NTU):</label>
      <input type="number" step="0.01" name="turbidity" required />

      <input type="submit" value="Predict Suitable Fish" />
    </form>
  </body>
</html>
